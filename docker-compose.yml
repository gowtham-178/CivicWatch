version: "3.8"

services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - rag-service

  frontend:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - backend

  rag-service:
    build: ./rag-model
    ports:
      - "8000:8000"
    env_file:
      - ./rag-model/.env
    environment:
      - PORT=8000